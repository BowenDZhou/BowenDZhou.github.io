<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bowen's Portfolio</title>
    <style>
        /* class styling */
        @font-face {
            font-family: 'San Francisco Heavy';
            src: url(fonts/SFPro/OpenType/SF-Pro-Display-Heavy.otf) format('opentype');
        }
        @font-face {
            font-family: 'San Francisco Light';
            src: url(fonts/SFPro/OpenType/SF-Pro-Display-Light.otf) format('opentype');
        }
        .titlespacedword {
            letter-spacing: 15px;
            font-size: 48px;
        }
        .subtitlespacedword{
            letter-spacing: 5px;
        }
        .container {
            padding: 20px;
            max-width: 1200px;
            margin: 50px;;
            border-radius: 7px;
            background-color: #69b9fa;
        }
        .section {
            margin: 20px 0;
        }
        .section h2 {
            border-bottom: 2px solid #61dafb;
            padding-bottom: 10px;
        }
        .project {
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 15px;
            background-color: #fff;
            margin-bottom: 20px;
        }
        .project img {
            max-width: 100%;
            height: auto;
            border-radius: 5px;
        }
        .iconnav{
            margin-top: 150px;

        }
        /* HTML given container styling */
        header {
            font-family: 'San Francisco Heavy', sans-serif;
            font-size: larger;
            background-color: #ffffff;
            color: #000000;
            padding: 50px;
            text-align: center;
        }
        header h5 {
            margin-top: 2%;
            margin-bottom: 0px;
            color: #919191;
        }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            color: #333;
        }
        p {
            font-family: 'San Francisco Light',sans-serif;
            text-align: center;
        }
        header h1 {
            margin: 0;
            font-size: 2em;
        }
        nav {
            display: flex;
            justify-content: center;
            background-color: #ffffff;
        }
        nav a {
            color: #000000;
            padding: 14px 50px;
            text-decoration: none;
            font-family: 'San Francisco Light', sans-serif;
            border-radius: 5px;
        }
        nav a:hover {
            background-color: #69b9fa;
        }
        nav b{
            font-family: 'San Francisco', sans-serif;
            background-color: #61dafb;
            margin: 50px;
            padding: 10px;
            border-radius: 10px;
        }
        footer {
            font-family: 'San Francisco Light';
            background-color:#e4e4e4;
            color: #1d1d1d;
            text-align: center;
            padding: 10px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>

    
</head>
<body>
    <header>
        <h1 class="titlespacedword">BOWEN ZHOU</h1>
        <h5 class="subtitlespacedword">ASPIRING INDIE GAME PROGRAMMER</h5>
    </header>
    <nav>
        <a href="#about">About</a>
        <a href="#projects">Media</a>
        <a href="#contact">Contact</a>
    </nav>
    <nav class="iconnav">
        <b>
            <image src= "images/briefcase.png" style="max-width: 100%; max-height: 100%; "></image>
            <p>Work</p>
        </b>
        <b> <image src= "images/wrench.png" style="max-width: 100%; max-height: 100%;"></image>
            <p>Projects</p>
        </b>
        <b> <image src= "images/love.png" style="max-width: 100%; max-height: 100%;"></image>
            <p>Passions</p>
        </b>
    </nav>
    <footer>
        <p>&copy; 2024 Bowen. All rights reserved.</p>
    </footer>
</body>
</html>
